<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kalmado RO Patcher</title>
    <style>
        /* Import a clean gaming font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Roboto:wght@400;700&display=swap');

        body {
            /* Active background image with dark gradient overlay for text readability */
           background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('kalmado1.png') no-repeat center center fixed;
    background-size: cover;
    color: #f8fafc;
    font-family: 'Roboto', sans-serif;
    text-align: center;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 20px;
    box-sizing: border-box;
    overflow: hidden;

        .header-section h1 {
            font-family: 'Cinzel', serif;
            color: #fbbf24;
            font-size: 36px;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* News / Patch Notes Box */
        .news-box {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 8px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .news-box h3 {
            color: #fbbf24;
            font-size: 16px;
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .news-box ul {
            margin: 0;
            padding-left: 20px;
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Footer & Play Button Area */
        .footer-section {
            margin-bottom: 10px;
        }

        .play-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            border: 1px solid #f59e0b;
            padding: 14px 45px;
            font-size: 18px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
            transform: translateY(-1px);
        }

        .play-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Kalmado RO</h1>
        <p id="status-text">Checking for updates...</p>
    </div>

    <div class="news-box">
        <h3>Server Patch Notes</h3>
        <ul>
            <li>Initial server release and setup.</li>
            <li>Custom asset package (0001.thor) loaded.</li>
            <li>Secure HTTPS connection established.</li>
        </ul>
    </div>

    <div class="footer-section">
        <button class="play-btn" onclick="window.location.href='ragnarok.exe';">PLAY GAME</button>
    </div>

</body>
</html>
